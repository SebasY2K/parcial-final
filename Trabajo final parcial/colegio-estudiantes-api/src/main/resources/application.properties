# ===================================================================
# Configuracion del Servidor y Base de Datos - Sistema Escolar REST
# ===================================================================
spring.application.name=colegio-estudiantes-api
server.port=8080

# Configuracion de Base de Datos H2 (lista para ejecutar sin configuracion externa)
spring.datasource.url=jdbc:h2:mem:colegio_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 habilitada en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Rutas de OpenAPI y Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
